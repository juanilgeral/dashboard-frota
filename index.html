<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetControl Pro — Juanil Transportes e Locações</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --blue:#1a6fc4;--blue-dark:#0d4a8a;--blue-light:#3a8fe4;
  --accent:#f5a623;--green:#27ae60;--red:#e74c3c;--yellow:#f39c12;
  --bg:#0b1220;--bg3:#162033;--card:#1a2540;--card2:#1f2d4a;
  --border:#2a3d5e;--text:#e8eef8;--text2:#8ca0c0;--text3:#4a6080;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
header{background:linear-gradient(135deg,var(--blue-dark) 0%,#0a3060 60%,#081a3a 100%);border-bottom:3px solid var(--blue);padding:0 14px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:200;box-shadow:0 4px 24px rgba(0,0,0,0.5);}
.logo-area{display:flex;align-items:center;gap:10px;}
.logo-badge{background:white;border-radius:8px;padding:5px 11px;box-shadow:0 2px 12px rgba(26,111,196,0.4);}
.logo-badge span{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:900;color:var(--blue);letter-spacing:1px;display:block;}
.logo-badge small{display:block;font-size:7px;color:#555;font-weight:600;letter-spacing:0.5px;}
.sys-title h1{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:900;letter-spacing:2px;color:white;line-height:1;}
.sys-title h1 span{color:var(--accent);}
.sys-title small{font-size:9px;color:var(--text2);letter-spacing:1px;text-transform:uppercase;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.live-badge{background:#c0152a;color:white;font-size:13px;font-weight:900;padding:6px 14px;border-radius:24px;letter-spacing:2px;animation:pulse-red 1.2s infinite;box-shadow:0 0 12px rgba(220,30,50,.6);text-shadow:0 1px 3px rgba(0,0,0,.4);}
@keyframes pulse-red{0%,100%{background:#c0152a;box-shadow:0 0 12px rgba(220,30,50,.6);}50%{background:#e8192f;box-shadow:0 0 28px rgba(232,25,47,.95);}}
.hdr-clock{font-size:11px;color:var(--text2);text-align:right;}
.hdr-clock strong{display:block;color:white;font-size:13px;}
.btn-sync{background:linear-gradient(135deg,#1a8a4a,#0f5c30);color:white;border:none;border-radius:7px;padding:7px 13px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;box-shadow:0 2px 12px rgba(26,138,74,.3);display:flex;align-items:center;gap:5px;}
.btn-sync:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(26,138,74,.5);}
.btn-sync:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-sync.syncing{animation:pulse-sync-red 0.8s infinite!important;background:linear-gradient(135deg,#c0152a,#8a0f1e)!important;color:white!important;box-shadow:0 0 16px rgba(220,30,50,.7)!important;}
.btn-sync.syncing span:first-child{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse-sync-red{0%,100%{background:linear-gradient(135deg,#c0152a,#8a0f1e);box-shadow:0 0 12px rgba(220,30,50,.6);}50%{background:linear-gradient(135deg,#e8192f,#b01020);box-shadow:0 0 28px rgba(232,25,47,.95);}}
.sync-status{font-size:10px;padding:3px 8px;border-radius:12px;font-weight:700;letter-spacing:.5px;white-space:nowrap;}
.sync-status.ok{background:rgba(39,174,96,.2);border:1px solid rgba(39,174,96,.4);color:#5de88a;}
.sync-status.err{background:rgba(231,76,60,.2);border:1px solid rgba(231,76,60,.4);color:#ff9090;}
.sync-status.loading{background:rgba(26,111,196,.2);border:1px solid rgba(26,111,196,.4);color:#5db0ff;}
.sheets-panel{background:var(--bg3);border:1.5px solid #1a8a4a55;border-radius:10px;padding:14px;margin-bottom:14px;}
.sheets-panel .sp-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sheets-panel .sp-head span{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#5de88a;letter-spacing:1px;}
.sheets-url-row{display:flex;gap:6px;align-items:flex-start;}
.sheets-url-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-size:11px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .2s;}
.sheets-url-row input:focus{border-color:#1a8a4a;}
.sheets-interval{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px;color:var(--text2);}
.sheets-interval select{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:4px 7px;color:var(--text);font-size:11px;font-family:'Barlow',sans-serif;outline:none;}
#sheets-last-sync{font-size:10px;color:var(--text3);margin-top:6px;}
#date-bar{background:var(--card);border-bottom:1px solid var(--border);padding:7px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:60px;z-index:150;box-shadow:0 2px 12px rgba(0,0,0,.3);}
#date-bar label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);}
#date-select{background:var(--bg3);border:1.5px solid var(--border);border-radius:7px;padding:5px 11px;color:var(--text);font-size:13px;font-family:'Barlow',sans-serif;outline:none;cursor:pointer;transition:border-color .2s;min-width:160px;}
#date-select:focus{border-color:var(--blue);}
.date-nav{display:flex;gap:5px;}
.btn-nav{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text2);padding:5px 10px;cursor:pointer;font-size:13px;transition:all .2s;}
.btn-nav:hover{border-color:var(--blue);color:var(--text);}
.date-info{font-size:11px;color:var(--text2);margin-left:auto;}
.date-info strong{color:var(--accent);}
#no-data-msg{display:none;background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);color:#ff9090;border-radius:7px;padding:6px 12px;font-size:11px;}
main{padding:12px 14px;width:100%;}
.sec{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--blue-light);margin-bottom:10px;padding-left:8px;border-left:3px solid var(--blue);}
.kpi-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 9px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s;}
.kpi-card:hover{transform:translateY(-2px);border-color:var(--blue-light);}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--blue));}
.kpi-icon{font-size:17px;margin-bottom:1px;}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;color:var(--kc,var(--blue-light));line-height:1;}
.kpi-lbl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.kpi-sub{font-size:9px;color:var(--text3);margin-top:1px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px;transition:border-color .2s,transform .2s;}
.chart-card:hover{border-color:var(--blue);transform:translateY(-1px);}
.ct{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text);margin-bottom:11px;display:flex;align-items:center;gap:7px;}
.ct .badge{font-size:9px;background:var(--blue);color:white;padding:2px 5px;border-radius:9px;font-weight:600;}
.cw{position:relative;height:300px;}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.prob-item{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.prob-lbl{font-size:11px;color:var(--text2);}
.prob-bw{flex:1;margin:0 8px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.prob-b{height:100%;border-radius:3px;transition:width .6s ease;}
.prob-pct{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;min-width:34px;text-align:right;}
.sp{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px;}
.sp-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:11px;letter-spacing:1px;text-transform:uppercase;}
.sp-title span{color:var(--accent);}
.sp-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px;}
.fg label{display:block;font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:600;}
.fg input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--text);font-size:12px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .2s;}
.fg input:focus{border-color:var(--blue);}
.st-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-bottom:5px;transition:border-color .2s;}
.st-row:hover{border-color:var(--blue);}
.st-lbl{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text);}
.st-dot{width:8px;height:8px;border-radius:50%;}
.st-val input{width:52px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text);font-size:13px;font-weight:700;text-align:center;font-family:'Barlow Condensed',sans-serif;outline:none;}
.st-val input:focus{border-color:var(--blue);}
.driver-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:7px;margin-bottom:16px;}
.dr-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 10px;display:flex;align-items:center;gap:8px;transition:border-color .2s,transform .2s;}
.dr-card:hover{border-color:var(--blue);transform:translateY(-1px);}
.dr-av{width:33px;height:33px;border-radius:50%;background:linear-gradient(135deg,var(--blue-dark),var(--blue));display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:white;flex-shrink:0;border:2px solid var(--blue-light);}
.dr-info{flex:1;min-width:0;}
.dr-name{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dr-ops{font-size:9px;color:var(--text2);margin-top:1px;}
.dr-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px;margin-bottom:16px;overflow-x:auto;}
.fleet-table{width:100%;border-collapse:collapse;font-size:11px;}
.fleet-table th{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);padding:6px 8px;border-bottom:2px solid var(--border);text-align:left;white-space:nowrap;}
.fleet-table td{padding:7px 8px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;}
.fleet-table tr:last-child td{border-bottom:none;}
.fleet-table tr:hover td{background:var(--card2);}
.fleet-table tr.em-transito td{background:rgba(26,111,196,.07);}
.fleet-table tr.em-transito:hover td{background:rgba(26,111,196,.13);}
.fleet-table tr.programada td{background:rgba(245,166,35,.05);}
.fleet-table tr.programada:hover td{background:rgba(245,166,35,.10);}
.fleet-table tr.viagem-finalizada td{background:rgba(39,174,96,.05);}
.fleet-table tr.viagem-finalizada:hover td{background:rgba(39,174,96,.1);}
.op-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;}
.op-cv{background:rgba(230,200,0,.18);color:#f5d800;border:1px solid rgba(230,200,0,.45);}
.op-ls{background:rgba(232,64,64,.15);color:#ff7070;border:1px solid rgba(232,64,64,.3);}
.op-tl{background:rgba(46,213,115,.15);color:#2ed573;border:1px solid rgba(46,213,115,.4);}
.op-ht{background:rgba(39,174,96,.18);color:#27ae60;border:1px solid rgba(39,174,96,.45);}
.op-nl{background:rgba(200,0,0,.2);color:#ff2020;border:1px solid rgba(200,0,0,.5);}
.op-gr{background:rgba(158,158,158,.15);color:#9e9e9e;border:1px solid rgba(158,158,158,.4);}
.transito-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:9px;background:rgba(26,111,196,.25);border:1px solid rgba(58,143,228,.5);color:#5db0ff;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;white-space:nowrap;}
.transito-dot{width:4px;height:4px;border-radius:50%;background:#5db0ff;display:inline-block;flex-shrink:0;animation:pulse-tdot 1.4s infinite;}
@keyframes pulse-tdot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.6);}}
.prog-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:9px;background:rgba(245,166,35,.18);border:1px solid rgba(245,166,35,.5);color:#f5a623;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;white-space:nowrap;}
.prog-dot{width:4px;height:4px;border-radius:50%;background:#f5a623;display:inline-block;flex-shrink:0;}
.reserva-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:9px;background:rgba(149,165,166,.15);border:1px solid rgba(149,165,166,.4);color:#95a5a6;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;white-space:nowrap;}
.fleet-table tr.reserva td{background:rgba(149,165,166,.04);opacity:.75;}
.fleet-table tr.reserva:hover td{background:rgba(149,165,166,.09);opacity:1;}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;align-items:center;justify-content:center;padding:14px;}
#modal-overlay.open{display:flex;}
#modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.mh{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px 12px;border-bottom:1px solid var(--border);}
.mh-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;color:var(--text);}
.mh-sub{font-size:10px;color:var(--text2);margin-top:2px;}
.mcl{background:var(--bg3);border:1px solid var(--border);color:var(--text2);width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:14px;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mcl:hover{background:var(--red);color:white;border-color:var(--red);}
.mtabs{display:flex;padding:0 22px;border-bottom:1px solid var(--border);}
.mtab{background:none;border:none;color:var(--text2);padding:10px 15px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;transition:all .2s;}
.mtab:hover{color:var(--text);}
.mtab.active{color:var(--blue-light);border-bottom-color:var(--blue-light);}
.tab-c{display:none;padding:18px 22px;}
.tab-c.active{display:block;}
.tip{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:10px;color:var(--text2);line-height:1.6;margin-bottom:12px;}
.tip strong{color:var(--text);}
.tip em{color:var(--accent);font-style:normal;}
kbd{background:var(--border);color:var(--text);padding:1px 4px;border-radius:3px;font-size:9px;font-family:monospace;}
#paste-area{width:100%;height:140px;background:var(--bg);border:2px dashed var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:10px;font-family:'Barlow',sans-serif;resize:vertical;outline:none;transition:border-color .2s;}
#paste-area:focus{border-color:var(--blue-light);}
.tact{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;}
.btn-p{background:var(--blue);color:white;border:none;border-radius:6px;padding:8px 15px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn-p:hover{background:var(--blue-light);}
.btn-s{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:6px;padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn-s:hover{border-color:var(--blue);color:var(--text);}
.fb{margin-top:8px;font-size:10px;border-radius:6px;padding:7px 10px;display:none;}
.fb.ok{background:rgba(39,174,96,.12);border:1px solid rgba(39,174,96,.3);color:#5de88a;display:block;}
.fb.err{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.3);color:#ff7070;display:block;}
.fb.inf{background:rgba(26,111,196,.12);border:1px solid rgba(26,111,196,.3);color:#5db0ff;display:block;}
.drop-zone{border:2px dashed var(--border);border-radius:9px;padding:28px 18px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:8px;}
.drop-zone:hover,.drop-zone.dov{border-color:var(--blue);background:rgba(26,111,196,.05);}
.drop-icon{font-size:34px;margin-bottom:8px;}
.drop-txt{font-size:13px;color:var(--text);font-weight:600;margin-bottom:3px;}
.drop-sub{font-size:10px;color:var(--text2);}
.mfg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.mfg .full{grid-column:span 3;}
.mf label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:block;margin-bottom:3px;}
.mf input,.mf select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:7px 9px;color:var(--text);font-size:11px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .2s;}
.mf input:focus,.mf select:focus{border-color:var(--blue);}
.mf select option{background:var(--bg3);}
.mr-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:6px 9px;margin-bottom:4px;font-size:10px;}
.mr-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:3px;}
.mr-del:hover{color:var(--red);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:white;padding:9px 16px;border-radius:8px;font-weight:600;font-size:11px;opacity:0;transform:translateY(10px);transition:all .3s;z-index:9999;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
#closed-overlay{display:none;position:relative;z-index:10;margin:0 0 16px 0;}
#closed-overlay.show{display:block;}
.closed-banner{background:linear-gradient(135deg,rgba(13,74,138,.55) 0%,rgba(11,18,32,.85) 100%);border:1.5px solid var(--blue);border-radius:14px;padding:36px 30px 32px;text-align:center;position:relative;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.45);}
.closed-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(26,111,196,.18) 0%,transparent 70%),radial-gradient(ellipse 40% 30% at 80% 80%,rgba(245,166,35,.07) 0%,transparent 60%);pointer-events:none;}
.closed-icon{font-size:48px;display:block;margin-bottom:8px;filter:drop-shadow(0 0 18px rgba(26,111,196,.6));}
.closed-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(26,111,196,.18);border:1.5px solid rgba(26,111,196,.45);border-radius:24px;padding:4px 15px;margin-bottom:14px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#5db0ff;}
.closed-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#5db0ff;animation:pulse-dot 2s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}
.closed-title{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--text);line-height:1.1;margin-bottom:7px;}
.closed-title span{color:var(--accent);}
.closed-sub{font-size:13px;color:var(--text2);margin-bottom:22px;line-height:1.6;max-width:500px;margin-left:auto;margin-right:auto;}
